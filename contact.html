<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Grievance - Gram Panchayat Barai</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-text">
                <h1>GP Barai</h1>
                <p>Block: Chiraigaon, Varanasi</p>
            </div>
        </div>
        <div class="menu-toggle" id="mobile-menu">&#9776;</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About & Leadership</a></li>
                <li><a href="services.html">Works & Schemes</a></li>
                <li><a href="contact.html">Contact & Grievance</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="section-title">
            <h2>Public Grievance & Contact Portal</h2>
            <p>Connect directly with the Panchayat office or register complaints</p>
        </div>

        <form id="grievanceForm" onsubmit="sendToWhatsApp(event)">
    <div class="form-group">
        <label for="name">Your Full Name</label>
        <input type="text" id="name" required placeholder="Enter your full name">
    </div>

    <div class="form-group">
        <label for="phone">Mobile Number</label>
        <input type="tel" id="phone" required placeholder="Enter 10-digit mobile number">
    </div>

    <div class="form-group">
        <label for="category">Subject / Issue Type</label>
        <select id="category">
            <option value="Road/Drainage Issue">Road/Drainage Issue</option>
            <option value="Water Supply / Handpump Repair">Water Supply / Handpump Repair</option>
            <option value="PMAY Housing Query">PMAY Housing Query</option>
            <option value="General Grievance / Suggestion">General Grievance / Suggestion</option>
        </select>
    </div>

    <div class="form-group">
        <label for="message">Detailed Message / Application</label>
        <textarea id="message" required placeholder="Type your concern or request clearly..."></textarea>
    </div>

    <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Submit via WhatsApp</button>
</form>
    </div>

    <footer>
        <p>&copy; 2026 Gram Panchayat Barai, Chiraigaon, Varanasi (UP). All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
